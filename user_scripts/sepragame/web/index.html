	<script>
		noop = function () { }
		musicloop = $buzz.play("/audio/mavine.mp3")
		//$buzz.loop(musicloop, true)
		musicloopurl = ""
		textObjects = []

		function createPromise() { // Creates a promise that has a resolve function
			let promise = new Promise(resolve => {
				var res = resolve
			})
			promise.resolve = res
			return promise
		}
		genQ = 1
		setInterval(() => {
			//if (generatedSoundsPlayed < 3) currentSamples = 44100
			//if (generatedSoundsPlayed > 2) currentSamples = 22050
			//if (generatedSoundsPlayed > 8) currentSamples = 5512
			genQ = 1
		}, 300);
		function playSound(data) { // from sound-brick
			if (data.isloop == false) {
				if (data.sfxr) {
					genQ += 0.1
					if (genQ > 10) genQ = 10
					var audio = new SoundEffect(data.url).parameters.mutate()
					audio.sound_vol = 0.2 / genQ
					audio.sample_rate = Math.round(44100 / genQ)
					audio = new SoundEffect(audio).generate().getAudio()
					return audio.play();
				} else {
					//var audio = new Audio(data.url)
					//audio.volume = data.volume// / 5
				}
				$buzz.play(data)
				//audio.play();
			} else {
				if (settings.music) {
					if (musicloopurl !== data.url) {
						let thatLoop = musicloop
						$buzz.fade(thatLoop, 0, 6, 'linear');
						setTimeout(() => {
							$buzz.destroy(thatLoop)
						}, 8000);

						musicloopurl = data.url
						data.stream = true
						musicloop = $buzz.play(data.url)
						$buzz.loop(musicloop, true)
					}
				}
			}
		}
		function detectMobile() {
			if (navigator.userAgent.toLowerCase().match(/mobile/i) || navigator.userAgent.toLowerCase().match(/android/i)) {
				return true
			} else return false
		}
		function detectSmartTV() {
			const teles = ["smart-tv", "smarttv", "googletv", "appletv", "hbbtv", "pov_tv", "netcast.tv"]
			const userAgent = navigator.userAgent.toLowerCase()
			if (teles.some(tv => userAgent.includes(tv)) === true) {
				return true
			} else return false
		}
		function clusterPointInsideBrick(pos) {
			// Another note, the brick could be also returned to allow for repositioning on bricks that aren't strictly in a grid.
			let cluster = brickClusters.get(`${Math.floor(pos.x / 128)} ${Math.floor(pos.z / 128)} ${Math.floor(pos.y / 128)}`) // Get the terrain cluster
			if (cluster) {
				for (let i = 0; i < cluster.bricks.length; i++) {
					const brick = cluster.bricks[i];
					if (!brick.collision) continue;

					if (((brick.position.x <= pos.x + 1 && brick.position.x + brick.scale.x >= pos.x - 1) &&
						(brick.position.y <= pos.z + 1 && brick.position.y + brick.scale.y >= pos.z - 1) &&
						(brick.position.z <= pos.y && brick.position.z + brick.scale.z >= pos.y)) === true) {
						return true // Intersected!
					}
				}

				return false // No intersection
			} else {
				return false // The terrain cluster doesn't exist so assume nothing
			}
		}

			function processMovementVector({
				activeKeyAction, camera, sensitivity, mesh
			}) {
				let dir = camera.getForwardRay().direction
				let normal_dir = new BABYLON.Vector2(dir.x, dir.z).normalize()


				const time_scalar = 0.017 // might want to change this to something else or remove it entirely

				let z_movement = 0
				let y_movement = 0
				let x_movement = 0
				let setCamera = false


				if (joystickEnabled) {
					if (joystickXAddPos > 10 || joystickXAddPos < -10 || joystickYAddPos > 10 || joystickYAddPos < -10) {
						x_movement = joystickXAddPos / 100
						z_movement = joystickYAddPos / 100
						setCamera = true
					}
					if (!checkCollision) {
						player.yVel = joystickBuilderElevate * 1.2
					}
				} else {
					if (activeKeyAction.has("KeyA")) {
						x_movement -= 1
						setCamera = true
					}
					if (activeKeyAction.has("KeyD")) {
						x_movement += 1
						setCamera = true
					}
					if (activeKeyAction.has("KeyW")) {
						z_movement += 1
						setCamera = true
					}
					if (activeKeyAction.has("KeyS")) {
						z_movement -= 1
						setCamera = true
					}
					if (!checkCollision) {
						if (activeKeyAction.has("KeyR")) {
							player.yVel = 32
							setCamera = true
						} else if (activeKeyAction.has("KeyF")) {
							player.yVel = -32
							setCamera = true
						} else {
							player.yVel = 0
						}
					}
				}
				let normal_move = new BABYLON.Vector2(x_movement, z_movement
				).normalize().scale(
					time_scalar * sensitivity
				)

				if (setCamera == true) { // TODO: this shouldn't be in processMovementVector.
					mesh.position.y = 0
					mesh.lookAt(new BABYLON.Vector3(dir.x, 0, dir.z))
					mesh.position.y = -2.5
					mesh.rotation = new BABYLON.Vector3(mesh.rotation.x, mesh.rotation.y + playerModelRotationOffset, mesh.rotation.z) // Guna
					player.playerRotation = Math.floor((mesh.rotation.y - playerLogicRotationOffset) * 57.5) // Guna
				}

				return new BABYLON.Vector3(
					normal_move.y * normal_dir.x + normal_move.x * normal_dir.y,
					y_movement * time_scalar,
					normal_move.y * normal_dir.y - normal_move.x * normal_dir.x
				)
			}

						function formatChat(str) { // Formats chat based on unoffical 0.4 client
							//return [{text: str, color: "ffffff"}]
							let strings = []
							let curString = ""
							let color = "ffffff"
							let colorPrev = "ffffff"
							for (let i = 0; i < str.length; i++) {
								if (str.slice(i, i + 7) === "<color:") {
									if (vaildHex(str.slice(i + 7, i + 7 + 6)) === true) {
										color = str.slice(i + 7, i + 7 + 6)
										if (i === 0) colorPrev = color
										i = i + 14
										//str = str.substr(i, i + 14)
									}
								} else if (str.slice(i, i + 2) === "\\c") {
									if (i == 1 || str[i - 1] !== "\\") {
										switch (str[i + 2]) {
											case "0":
												color = "ffffff"
												break;
											case "1":
												color = "aaaaaa"
												break;
											case "2":
												color = "555555"
												break;
											case "3":
												color = "000000"
												break;
											case "4":
												color = "0000ff"
												break;
											case "5":
												color = "00ff00"
												break;
											case "6":
												color = "ff0000"
												break;
											case "7":
												color = "ffff00"
												break;
											case "8":
												color = "00ffff"
												break;
											case "9":
												color = "ff00ff"
												break;
											default:
												console.log("This isn't right!", str[i + 2])
												break;
										}
										if (i === 0) colorPrev = color
										i = i + 3
										//str = str.substr(i, i + 3)
									}
								}
								if (color !== colorPrev) {
									if (curString !== "") {
										strings.push({ text: curString, color: colorPrev })
										colorPrev = color
										curString = ""
									}
								}
								curString = curString + str[i]
							}
							if (curString !== "") {
								strings.push({ text: curString, color: colorPrev })
								curString = ""
							}
							//console.log(strings)
							return strings
						}

			/** Return the distance between two points. */
			function pointDistance3D(p1, p2) {
				// ((x2 - x1)^2 + (y2 - y1)^2 + (z2 - z1)^2)^1/2
				return Math.sqrt((Math.pow(p1.x - p2.x, 2)) + (Math.pow(p1.y - p2.y, 2)) + (Math.pow(p1.z - p2.z, 2)));
			}

			function sqr(x) {
				return Math.pow(x, 2)
			}

			function convert3D(vec3) {
				let dX = (player.position.x - camera.globalPosition.x)
				let dY = (player.position.y - camera.globalPosition.y)
				let dZ = (player.position.z - camera.globalPosition.z)
				let nn = Math.max(Math.sqrt(dX * dX + dY * dY + dZ * dZ), 0.01);
				dX /= nn;
				dY /= nn;
				dZ /= nn;
				let uX = 0;
				let uY = 0;
				let uZ = 1;
				nn = uX * dX + uY * dY + uZ * dZ;
				uX -= nn * dX;
				uY -= nn * dY;
				uZ -= nn * dZ;
				nn = Math.sqrt(uX * uX + uY * uY + uZ * uZ);
				uX /= nn;
				uY /= nn;
				uZ /= nn;
				const FOV = camera.fov * 57.2957795
				const tFOV = Math.tan(FOV * Math.PI / 360);
				uX *= tFOV;
				uY *= tFOV;
				uZ *= tFOV;
				let vX = uY * dZ - dY * uZ;
				let vY = uZ * dX - dZ * uX;
				let vZ = uX * dY - dX * uY;
				const aspect = window.innerWidth / window.innerHeight
				vX *= aspect;
				vY *= aspect;
				vZ *= aspect;
				var pX, pY, pZ, mm;
				pX = (vec3.x - camera.globalPosition.x)
				pY = (vec3.y - camera.globalPosition.z)
				pZ = (vec3.z - camera.globalPosition.y)
				mm = pX * dX + pY * dY + pZ * dZ
				if (mm > 0) {
					pX /= mm
					pY /= mm
					pZ /= mm

					mm = (pX * vX + pY * vY + pZ * vZ) / sqr((aspect) * Math.tan(FOV * Math.PI / 360))
					const x_2d = (mm + 1) / 2 * window.innerWidth
					mm = (pX * uX + pY * uY + pZ * uZ) / sqr(Math.tan(FOV * Math.PI / 360))
					const y_2d = (1 - mm) / 2 * window.innerHeight
					return [x_2d, y_2d]
				} else {
					return [0, -100]
				}
			}

								})
							}
							if (!pressed.has(e.code)) {
								if (!(e.key === " " && creature.startsWith("builder") && checkCollision == true)) socket.emit('keypress', e.key)
								pressed.add(e.code)
							}
						}
					)
				))
				currentActions.push(scene.actionManager.registerAction(
					new BABYLON.ExecuteCodeAction(
						BABYLON.ActionManager.OnKeyUpTrigger,
						e => {
							e = e.sourceEvent
							pressed.delete(e.code)
						}
					)
				))


				let cameraTarget = new BABYLON.Mesh("camera target", scene)
				cameraTarget.parent = parent
				let cameraOffsetX = 0.0
				let cameraOffsetZ = 0.0

				camera.parent = cameraTarget

				let lastFrame = performance.now()
				scene.onBeforeRenderObservable.add(() => {
					let delta = scene.deltaTime
					if (0 >= delta) delta = 1
					if (150 <= delta) delta = 150
					delta = delta / 1000
					player.yVel += gravity * delta
					if (player.yVel < -100) player.yVel = -100
					let step = false

					if (checkCollision && clusterPointInsideBrick({ x: player.position.x, y: player.position.y - 2.4, z: player.position.z, })) {
						var xO = player.position.x
						player.position.x += player.xVel * delta * 10
						if (checkCollision && clusterPointInsideBrick({ x: player.position.x, y: player.position.y - 2.4, z: player.position.z, })) {
							player.position.x = xO
						}
						var zO = player.position.z
						player.position.z += player.zVel * delta * 10
						if (checkCollision && clusterPointInsideBrick({ x: player.position.x, y: player.position.y - 2.4, z: player.position.z, })) {
							player.position.z = zO
						}
					} else {
						let xCol = false
						const xO = player.position.x
						player.position.x += player.xVel * delta
						if (checkCollision && clusterPointInsideBrick({ x: player.position.x, y: player.position.y - 2.4, z: player.position.z, })) {
							xCol = true
							// player.position.x = xO
							// if (joystickEnabled) jump()
						}

						let zCol = false
						const zO = player.position.z
						player.position.z += player.zVel * delta
						if (checkCollision && clusterPointInsideBrick({ x: xO, y: player.position.y - 2.4, z: player.position.z, })) {
							zCol = true
							// player.position.z = zO
							// if (joystickEnabled) jump()
						}

						let count = 0
						if (xCol) count++
						if (zCol) count++

						// ogggmmmmmmm
						if (xCol || zCol) {
							if (count !== 2) {
								let xC = xO
								if (xCol) xC = player.position.x
								let zC = zO
								if (zCol) zC = player.position.z
								if (!player.onGround || clusterPointInsideBrick({ x: xC, y: (player.position.y - 2.4) + 4, z: zC, })) {
									if (xCol) player.position.x = xO
									if (zCol) player.position.z = zO
									if (joystickEnabled) jump()
								} else {
									player.position.y += 4
								}
							} else {
								player.position.x = xO
								player.position.z = zO
								if (joystickEnabled) jump()
							}
						}

						player.position.y += player.yVel * delta
						if (checkCollision && clusterPointInsideBrick({ x: player.position.x, y: player.position.y - 2.5, z: player.position.z, })) {
							player.position.y = (Math.floor(player.position.y / 4) * 4) + 2.5
							player.yVel = 0
							player.onGround = true
						} else player.onGround = false
					}


					if (!checkCollision) {
						let blockPos = { x: Math.floor(player.position.x / 4), y: Math.floor(player.position.z / 4), z: Math.floor((player.position.y - 2.3) / 4) }
						if (prevBlockPlacement.x !== blockPos.x || prevBlockPlacement.y !== blockPos.y || prevBlockPlacement.z !== blockPos.z) {
							prevBlockPlacement = blockPos
							if (holdingClick && !useCursorAsBC) socket.emit('positionclick', { x: player.position.x, y: player.position.z, z: player.position.y - 2.3, r: player.playerRotation + 90 })
							playSound({
								volume: 1,
								url: "/audio/brickhill/voxel/move.flac",
								isloop: false
							})
						}
					}

					let d = camera.getForwardRay().direction

					parent.lookAt(new BABYLON.Vector3(d.x, d.z, 333300)) // wat

					let normal_dir = new BABYLON.Vector2(d.x, d.z).normalize()
					cameraTarget.position = new BABYLON.Vector3(
						cameraOffsetZ * normal_dir.x + cameraOffsetX * normal_dir.y,
						1.8,
						cameraOffsetZ * normal_dir.y - cameraOffsetX * normal_dir.x
					)

					if (!alive) return

					let vec = processMovementVector({
						activeKeyAction: pressed,
						camera,
						sensitivity: speed,
						mesh: mesh
					})

					if (vec.x || vec.z) {

						vec = vec.multiplyByFloats(300, 0, 300)
						beginWalk()
						player.xVel = vec.x// * delta
						player.zVel = vec.z// * delta
					} else {
						player.xVel = 0
						player.zVel = 0
						//let vel = parent.physicsImpostor.getLinearVelocity()
						//parent.physicsImpostor.setLinearVelocity(vel.multiplyByFloats(0.7, 1.0, 0.7))
						//if (animationState !== "sit") {
						beginIdle()
						//}

					}

					if (camera.radius < 10) {
						mesh.position.y = 0
						let dir = camera.getForwardRay().direction
						mesh.lookAt(new BABYLON.Vector3(dir.x, 0, dir.z)) // ya?
						mesh.position.y = -2.5
						mesh.rotation = new BABYLON.Vector3(mesh.rotation.x, mesh.rotation.y + playerModelRotationOffset, mesh.rotation.z)
						player.playerRotation = Math.floor((mesh.rotation.y - playerLogicRotationOffset) * 60)

						if (isVisible === true) {
							mesh.getChildMeshes().forEach(m => {
								m.isVisible = false
							})
							isVisible = false
						}
					} else {
						if (isVisible === false) {
							mesh.getChildMeshes().forEach(m => {
								m.isVisible = true
							})
							isVisible = true
						}
					}
				})

			}

			function jump() {
				if (alive === false) return
				if (cameraState === "selector") return
				if (player.onGround === true) {
					player.yVel = 24
					playSound({
						volume: 1,
						url: "/audio/brickhill/tonecraft/sample/drums/5.ogg",
						isloop: false
					})
				}
			}

			loadedData = false



		})
	</script>
</body>

</html>
